name: 功能建議 / Feature request
description: 提出想要的功能或改進 / Suggest a feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題 / The problem you want to solve
      description: 你在讀論文或管理文獻時遇到什麼困難 / What gets in your way when reading or managing papers
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你想像的做法 / What you have in mind
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代做法 / Current workaround or alternatives
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 其他資訊 / Additional information
    validations:
      required: false
